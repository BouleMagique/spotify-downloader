[package]
name = "playlist-dl"
version = "0.2.0"
description = "Télécharge des playlists Spotify / Deezer / YouTube en MP3 tagués"
authors = ["BouleMagique"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "playlist_dl_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "stream", "http2", "system-proxy"] }
tokio = { version = "1.54.1", features = ["process", "fs", "io-util", "macros", "rt"] }
futures-util = "0.3.34"
zip = "9.8.2"
tar = "0.4.46"
which = "8.0.6"
xz2 = { version = "0.1.7", features = ["static"] }
thiserror = "2.0.21"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
